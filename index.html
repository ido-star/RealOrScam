<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f4ef">
    <title>אמיתי או הונאה? — מזהים הודעות</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #17231e;
        --muted: #64716b;
        --paper: #f5f4ef;
        --card: #fffefa;
        --green: #176b4a;
        --green-light: #e5f3eb;
        --red: #b7463b;
        --red-light: #fae9e5;
        --line: #e5e6df;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(ellipse at 12% 10%, #e8eee1 0, transparent 34rem),
          var(--paper);
        color: var(--ink);
      }

      button { font: inherit; }

      .page {
        width: min(100% - 32px, 760px);
        margin: 0 auto;
        padding: 28px 0 48px;
      }

      .topbar, .brand, .score-wrap, .progress-row, .message-heading, .actions {
        display: flex;
        align-items: center;
      }

      .topbar, .progress-row, .message-heading {
        justify-content: space-between;
      }

      .brand { gap: 10px; font-size: 15px; font-weight: 750; }
      .brand-mark {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border-radius: 11px;
        background: var(--green);
        color: white;
        font-size: 18px;
      }
      .score-wrap { gap: 8px; color: var(--muted); font-size: 13px; font-weight: 650; }
      .score {
        min-width: 42px;
        padding: 7px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--card);
        color: var(--ink);
        text-align: center;
      }

      main { padding-top: 52px; }
      .eyebrow {
        margin: 0 0 11px;
        color: var(--green);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0;
      }
      h1 {
        margin: 0;
        font-size: clamp(32px, 6vw, 48px);
        line-height: 1.05;
      }
      .intro {
        max-width: 550px;
        margin: 16px 0 28px;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.65;
      }

      .game-card, .welcome-card, .result-card {
        border: 1px solid var(--line);
        border-radius: 20px;
        background: var(--card);
        box-shadow: 0 16px 44px rgb(23 35 30 / 6%);
      }
      .welcome-card, .result-card { padding: clamp(24px, 6vw, 42px); }
      .game-card { overflow: hidden; }
      .progress-row {
        gap: 16px;
        padding: 20px 24px 16px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 650;
      }
      .progress-track {
        height: 5px;
        margin: 0 24px;
        overflow: hidden;
        border-radius: 5px;
        background: #edf0e9;
      }
      .progress-fill {
        width: 0;
        height: 100%;
        border-radius: inherit;
        background: var(--green);
        transition: width 180ms ease;
      }
      .message {
        margin: 20px 24px 0;
        padding: 22px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #fbfbf7;
      }
      .message-heading { gap: 12px; }
      .channel {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: var(--green);
        font-size: 12px;
        font-weight: 800;
      }
      .channel-icon { font-size: 16px; }
      .timestamp { color: #89918c; font-size: 12px; }
      .sender { margin: 18px 0 5px; font-size: 14px; font-weight: 750; }
      .detail { margin: 0; color: var(--muted); font-size: 12px; }
      .message-copy {
        margin: 22px 0 2px;
        color: #29362f;
        font-size: 15px;
        line-height: 1.7;
        overflow-wrap: anywhere;
      }
      .question {
        margin: 22px 24px 14px;
        font-size: 14px;
        font-weight: 750;
        text-align: center;
      }
      .actions {
        justify-content: center;
        gap: 12px;
        padding: 0 24px 24px;
      }
      .answer-button, .primary-button, .next-button {
        min-height: 48px;
        border: 0;
        border-radius: 12px;
        cursor: pointer;
        font-weight: 750;
        transition: transform 120ms ease, filter 120ms ease;
      }
      .answer-button { flex: 1; max-width: 220px; }
      .answer-button:hover, .primary-button:hover, .next-button:hover { filter: brightness(.96); transform: translateY(-1px); }
      .answer-button:focus-visible, .primary-button:focus-visible, .next-button:focus-visible {
        outline: 3px solid #e3b65c;
        outline-offset: 3px;
      }
      .ok-button { background: var(--green-light); color: #15583e; }
      .scam-button { background: var(--red-light); color: #a23830; }
      .feedback {
        margin: 0 24px 24px;
        padding: 16px 18px;
        border-radius: 12px;
        line-height: 1.55;
      }
      .feedback.correct { background: var(--green-light); color: #15583e; }
      .feedback.incorrect { background: var(--red-light); color: #8d3029; }
      .feedback strong { display: block; margin-bottom: 4px; }
      .feedback p { margin: 0; font-size: 14px; }
      .next-wrap { display: flex; justify-content: flex-end; padding: 0 24px 24px; }
      .next-button, .primary-button { padding: 0 22px; background: var(--green); color: white; }
      .result-card { text-align: center; }
      .result-icon { font-size: 42px; }
      .result-card h2 { margin: 14px 0 9px; font-size: 28px; }
      .result-card p { margin: 0 auto 24px; max-width: 440px; color: var(--muted); line-height: 1.65; }
      .result-card .primary-button { min-width: 150px; }
      .hint { margin: 18px 0 0; color: var(--muted); font-size: 12px; text-align: center; }
      [hidden] { display: none !important; }

      @media (max-width: 520px) {
        .page { width: min(100% - 24px, 760px); padding-top: 18px; }
        main { padding-top: 40px; }
        .intro { font-size: 15px; }
        .progress-row { padding: 18px 18px 14px; }
        .progress-track { margin: 0 18px; }
        .message { margin: 18px 14px 0; padding: 18px; }
        .question { margin-inline: 14px; }
        .actions { gap: 9px; padding-inline: 14px; }
        .feedback { margin-inline: 14px; }
        .next-wrap { padding-inline: 14px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div class="brand"><span class="brand-mark" aria-hidden="true">✓</span> אמיתי או הונאה?</div>
        <div class="score-wrap">ניקוד <span class="score" id="score" aria-live="polite">0</span></div>
      </header>

      <main>
        <section id="welcome" class="welcome-card" aria-labelledby="title">
          <p class="eyebrow">סמכו על תחושת הבטן</p>
          <h1 id="title">אמיתי או הונאה?</h1>
          <p class="intro">בכל יום מגיעות אליכם הודעות בדואר אלקטרוני, במסרונים ובהודעות פרטיות. תוכלו לזהות אילו מהן בטוחות? קראו כל הודעה והחליטו: אמיתית או הונאה.</p>
          <button class="primary-button" id="start-button" type="button">מתחילים לשחק <span aria-hidden="true">←</span></button>
          <p class="hint">10 הודעות · בלי הגבלת זמן · לומדים תוך כדי</p>
        </section>

        <section id="game" class="game-card" aria-label="משחק זיהוי הודעות" hidden>
          <div class="progress-row">
            <span id="round-label">הודעה 1 מתוך 10</span>
            <span id="streak-label">רצף השיא: 0</span>
          </div>
          <div class="progress-track" role="progressbar" aria-label="התקדמות במשחק" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <article class="message" aria-live="polite">
            <div class="message-heading">
              <span class="channel"><span class="channel-icon" id="channel-icon" aria-hidden="true"></span><span id="channel-name"></span></span>
              <span class="timestamp" id="timestamp"></span>
            </div>
            <p class="sender" id="sender"></p>
            <p class="detail" id="detail"></p>
            <p class="message-copy" id="message-copy"></p>
          </article>
          <p class="question">מה דעתכם?</p>
          <div class="actions" id="answer-actions">
            <button class="answer-button ok-button" type="button" data-answer="ok">✓ &nbsp; אמיתית</button>
            <button class="answer-button scam-button" type="button" data-answer="scam">⚠ &nbsp; הונאה</button>
          </div>
          <div id="feedback" class="feedback" role="status" hidden></div>
          <div class="next-wrap" id="next-wrap" hidden>
            <button class="next-button" id="next-button" type="button">ההודעה הבאה <span aria-hidden="true">←</span></button>
          </div>
        </section>

        <section id="results" class="result-card" aria-live="polite" hidden>
          <div class="result-icon" id="result-icon" aria-hidden="true"></div>
          <h2 id="result-title"></h2>
          <p id="result-copy"></p>
          <button class="primary-button" id="play-again-button" type="button">משחקים שוב</button>
        </section>
      </main>
    </div>

    <script>
      const messages = [
        {
          channel: "דואר אלקטרוני", icon: "✉", time: "היום, 9:41",
          sender: "הספרייה שלכם", detail: "מאת: notices@northside-library.example",
          copy: "צריך להחזיר את הספר עד יום שישי. אפשר להאריך את תקופת ההשאלה באפליקציה של הספרייה או להביא אותו לאחד הסניפים. שאלות? התקשרו למספר שמופיע בכרטיס הספרייה.",
          answer: "ok", reason: "זו תזכורת שגרתית שמפנה אתכם לאפליקציה מוכרת או למספר שכבר נמצא אצלכם, ולא מבקשת למסור מידע רגיש."
        },
        {
          channel: "מסרון", icon: "▣", time: "היום, 10:06",
          sender: "עדכון על משלוח", detail: "מאת: +1 (555) 010-2741",
          copy: "המשלוח נכשל: הכתובת אינה מלאה. שלמו עכשיו 1.25 דולר על משלוח חוזר: parcel-track.example/fee. השיבו STOP כדי למנוע את החזרת החבילה.",
          answer: "scam", reason: "הודעות לא צפויות על משלוח שדורשות תשלום קטן דרך קישור הן תרגיל נפוץ. בדקו את המעקב באפליקציה הרשמית של החנות או חברת המשלוחים."
        },
        {
          channel: "הודעה פרטית", icon: "◉", time: "אתמול",
          sender: "מאיה חן", detail: "אינסטגרם · חברה שאתם מכירים",
          copy: "היי! מצאתי את התמונות מהטיול של סוף השבוע והעליתי אותן לאלבום המשותף שלנו. הקישור נמצא בקבוצה שאנחנו כבר משתמשים בה 🙂",
          answer: "ok", reason: "ההודעה משתלבת בשיחה קיימת ומפנה למקום משותף שאתם כבר משתמשים בו. ובכל זאת, אם משהו נראה חשוד, בדקו עם החברה בדרך אחרת."
        },
        {
          channel: "דואר אלקטרוני", icon: "✉", time: "היום, 8:12",
          sender: "אבטחת החשבון", detail: "מאת: secure-alerts@account-check.example",
          copy: "זיהינו פעילות חשודה. החשבון שלכם ייסגר לצמיתות בעוד 30 דקות. אשרו כאן את הסיסמה ואת הקוד החד-פעמי כדי לשמור על הגישה לחשבון.",
          answer: "scam", reason: "דחיפות, איום בסגירת החשבון ובקשה לסיסמה או לקוד חד-פעמי הם סימני אזהרה בולטים. היכנסו ישירות לאתר הרשמי של השירות."
        },
        {
          channel: "מסרון", icon: "▣", time: "היום, 11:23",
          sender: "סם", detail: "מאת: +1 (555) 010-8830",
          copy: "אני מאחר בעשר דקות — הרכבת נעצרה בתחנה המרכזית. נפגשים בבית הקפה הרגיל? אכתוב כשאהיה במרחק שתי תחנות.",
          answer: "ok", reason: "זו הודעה אישית רגילה בלי בקשה חריגה או קישור. אם לא ציפיתם לה, בדקו עם סם במספר שאתם מכירים."
        },
        {
          channel: "הודעה פרטית", icon: "◉", time: "היום, 12:15",
          sender: "CryptoQueen_Official", detail: "טיקטוק · חשבון חדש",
          copy: "זכיתם! בחרתי דווקא בשם המשתמש שלכם להגרלה הפרטית שלי 🎉 שלחו כרטיסי מתנה בשווי 20 דולר כדי לאשר את הזכייה, ואחזיר לכם 2,000 דולר. אל תספרו לאף אחד!",
          answer: "scam", reason: "לא אמורים לשלם כדי לקבל פרס. כרטיסי מתנה, הבטחה לרווח מובטח, חשבון חדש ובקשת סודיות — כל אלה מצביעים על הונאה."
        },
        {
          channel: "דואר אלקטרוני", icon: "✉", time: "אתמול, 16:32",
          sender: "הגינה הקהילתית", detail: "מאת: team@maple-street-garden.example",
          copy: "בוקר ההתנדבות בשבת יתחיל בשעה 9:00. הביאו כפפות אם יש לכם; אנחנו נדאג לכלים ולתה. השיבו להודעה אם תוכלו להגיע.",
          answer: "ok", reason: "זו הזמנה פשוטה ולא לוחצת, בלי דרישה לכסף, לפרטי גישה או למידע אישי."
        },
        {
          channel: "מסרון", icon: "▣", time: "היום, 13:02",
          sender: "אמא", detail: "מאת: מספר לא מוכר",
          copy: "היי, זה הטלפון החדש שלי. איבדתי את הקודם ואני לא יכולה להתקשר. קנו בבקשה שני כרטיסי מתנה ושלחו לי את הקודים מיד. אל תספרו לאבא — זו הפתעה.",
          answer: "scam", reason: "מספר חדש ולא צפוי, בקשת כסף דחופה, כרטיסי מתנה וסודיות הם סימנים קלאסיים להתחזות. צרו קשר עם בן המשפחה במספר שכבר ידוע לכם."
        },
        {
          channel: "הודעה פרטית", icon: "◉", time: "היום, 14:47",
          sender: "חנות הספרים המקומית", detail: "אינסטגרם · חשבון שאתם עוקבים אחריו",
          copy: "אנחנו פתוחים היום עד 18:00. הספר שנבחר למפגש הקריאה השבועי נמצא על השולחן בכניסה, ופרטי האירוע מופיעים בפרופיל שלנו. נשמח לראותכם!",
          answer: "ok", reason: "זו הודעה פשוטה בלי לחץ או בקשה למידע רגיש. אם תרצו פרטים, היכנסו ישירות לפרופיל של החנות."
        },
        {
          channel: "דואר אלקטרוני", icon: "✉", time: "היום, 15:18",
          sender: "צוות השכר", detail: "מאת: payroll-review@workplace-docs.example",
          copy: "העברת המשכורת שלכם הוקפאה. פתחו את הטופס המצורף והזינו את פרטי הכניסה לעבודה, את סיסמת הבנק ואת מספר כרטיס האשראי המלא עוד היום, אחרת תפספסו את המשכורת הקרובה.",
          answer: "scam", reason: "צוות שכר לגיטימי לא אמור לבקש בדואר אלקטרוני את סיסמת הבנק או את מספר כרטיס האשראי המלא. פנו לצוות השכר בערוץ העבודה הרגיל שלכם."
        }
      ];

      const welcome = document.querySelector("#welcome");
      const game = document.querySelector("#game");
      const results = document.querySelector("#results");
      const scoreDisplay = document.querySelector("#score");
      const answerActions = document.querySelector("#answer-actions");
      const feedback = document.querySelector("#feedback");
      const nextWrap = document.querySelector("#next-wrap");
      const progressTrack = document.querySelector(".progress-track");
      let round = 0;
      let score = 0;
      let streak = 0;
      let bestStreak = 0;
      let answered = false;

      function showMessage() {
        const message = messages[round];
        answered = false;
        document.querySelector("#round-label").textContent = `הודעה ${round + 1} מתוך ${messages.length}`;
        document.querySelector("#streak-label").textContent = `רצף השיא: ${bestStreak}`;
        document.querySelector("#channel-icon").textContent = message.icon;
        document.querySelector("#channel-name").textContent = message.channel;
        document.querySelector("#timestamp").textContent = message.time;
        document.querySelector("#sender").textContent = message.sender;
        document.querySelector("#detail").textContent = message.detail;
        document.querySelector("#message-copy").textContent = message.copy;
        document.querySelector("#progress-fill").style.width = `${(round / messages.length) * 100}%`;
        progressTrack.setAttribute("aria-valuenow", String(round));
        answerActions.hidden = false;
        feedback.hidden = true;
        nextWrap.hidden = true;
      }

      function startGame() {
        round = 0;
        score = 0;
        streak = 0;
        bestStreak = 0;
        scoreDisplay.textContent = "0";
        welcome.hidden = true;
        results.hidden = true;
        game.hidden = false;
        showMessage();
      }

      function chooseAnswer(answer) {
        if (answered) return;
        answered = true;
        const message = messages[round];
        const correct = answer === message.answer;
        if (correct) {
          score += 1;
          streak += 1;
          bestStreak = Math.max(bestStreak, streak);
        } else {
          streak = 0;
        }
        scoreDisplay.textContent = String(score);
        document.querySelector("#streak-label").textContent = `רצף השיא: ${bestStreak}`;
        answerActions.hidden = true;
        feedback.hidden = false;
        feedback.className = `feedback ${correct ? "correct" : "incorrect"}`;
        feedback.replaceChildren();
        const heading = document.createElement("strong");
        heading.textContent = correct ? "נכון מאוד!" : `לא בדיוק — זו ${message.answer === "ok" ? "הודעה אמיתית" : "הונאה"}.`;
        const explanation = document.createElement("p");
        explanation.textContent = message.reason;
        feedback.append(heading, explanation);
        nextWrap.hidden = false;
        document.querySelector("#next-button").textContent = round === messages.length - 1 ? "לתוצאות ←" : "ההודעה הבאה ←";
      }

      function nextMessage() {
        round += 1;
        if (round < messages.length) {
          showMessage();
          return;
        }
        game.hidden = true;
        results.hidden = false;
        document.querySelector("#progress-fill").style.width = "100%";
        progressTrack.setAttribute("aria-valuenow", String(messages.length));
        const percent = Math.round((score / messages.length) * 100);
        document.querySelector("#result-icon").textContent = score >= 8 ? "🏆" : score >= 5 ? "🌱" : "🧭";
        document.querySelector("#result-title").textContent = score >= 8 ? "עין חדה!" : score >= 5 ? "תחושת בטן טובה!" : "ממשיכים להתאמן!";
        document.querySelector("#result-copy").textContent = `זיהיתם נכון ${score} מתוך ${messages.length} הודעות (${percent}%). אם יש ספק, אל תלחצו ואל תשיבו — צרו קשר עם האדם או הארגון בערוץ שאתם כבר סומכים עליו.`;
      }

      document.querySelector("#start-button").addEventListener("click", startGame);
      document.querySelector("#play-again-button").addEventListener("click", startGame);
      document.querySelector("#next-button").addEventListener("click", nextMessage);
      answerActions.addEventListener("click", (event) => {
        const button = event.target.closest("[data-answer]");
        if (button) chooseAnswer(button.dataset.answer);
      });
    </script>
  </body>
</html>
